<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpsRocket — Hero V3 · Terminal</title>
    <style>
      :root {
        --bg: #04060a;
        --grn: #41e08a;
        --amb: #ffcf6b;
        --mag: #ff3d78;
        --cy: #36d8e6;
        --dim: #5f7388;
        --ink: #d6e6df;
      }
      * { box-sizing: border-box; margin: 0; }
      html, body { height: 100%; }
      body {
        background: radial-gradient(ellipse at 50% 0%, #0a1118, var(--bg) 70%);
        color: var(--ink);
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        overflow: hidden;
      }
      body::after {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background: repeating-linear-gradient(
          0deg,
          rgba(255, 255, 255, 0.035) 0 1px,
          transparent 1px 3px
        );
        mix-blend-mode: overlay;
      }
      .scr {
        max-width: 1000px;
        margin: 0 auto;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 40px 32px;
      }
      .top {
        display: flex;
        align-items: center;
        gap: 12px;
        color: var(--dim);
        font-size: 12px;
        letter-spacing: 0.06em;
        border-bottom: 1px solid #16202c;
        padding-bottom: 14px;
        margin-bottom: 22px;
      }
      .top .opslogo {
        width: 26px;
        height: 26px;
        display: inline-block;
        background: #ec4899;
        -webkit-mask: url(ops.png) center / contain no-repeat;
        mask: url(ops.png) center / contain no-repeat;
      }
      .top b { color: var(--ink); }
      .top .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--grn); box-shadow: 0 0 10px var(--grn); }
      pre {
        font-size: clamp(12px, 1.5vw, 15px);
        line-height: 1.65;
        white-space: pre-wrap;
        margin: 0;
        min-height: 46vh;
      }
      .g { color: var(--grn); }
      .a { color: var(--amb); }
      .m { color: var(--mag); }
      .c { color: var(--cy); }
      .d { color: var(--dim); }
      h1 {
        font-size: clamp(30px, 5vw, 62px);
        font-weight: 800;
        letter-spacing: -0.02em;
        line-height: 1.05;
        margin: 26px 0 10px;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      h1 .hl {
        background: linear-gradient(90deg, var(--grn), var(--cy));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .cta {
        margin-top: 22px;
        display: inline-flex;
        gap: 10px;
        align-items: center;
        text-decoration: none;
        color: #04060a;
        background: var(--grn);
        font-weight: 800;
        padding: 13px 24px;
        border-radius: 8px;
        font-family: ui-sans-serif, system-ui, sans-serif;
        opacity: 0;
        transition: opacity 0.5s;
      }
      .cur::after {
        content: "▋";
        color: var(--grn);
        animation: bl 1s steps(1) infinite;
      }
      @keyframes bl { 50% { opacity: 0; } }
    </style>
  </head>
  <body>
    <div class="scr">
      <div class="top">
        <span class="opslogo" role="img" aria-label="OpsRocket"></span>
        <b>OpsRocket</b> <span class="d">// flight-physics core</span>
        <span style="margin-left:auto" class="d"
          ><span class="dot" style="display:inline-block"></span> validation
          harness · OpenRocket 24.12</span
        >
      </div>
      <pre id="log"></pre>
      <div id="reveal" style="opacity: 0; transition: opacity 0.6s">
        <h1>
          It matches OpenRocket<br /><span class="hl">to the last bit.</span>
        </h1>
        <a class="cta" id="cta" href="/workspace">▶ open the live workbench</a>
      </div>
    </div>

    <script>
      const L = [
        ['d', '$ opsrocket validate --against openrocket-24.12 --fixtures 17\n'],
        ['d', 'loading 17 example .ork projects ............ '],
        ['g', 'ok\n'],
        ['d', 'diff mass / CG vs OpenRocket MassCalculator . '],
        ['g', 'ok\n\n'],
        ['c', '  PHYSICS PARITY\n'],
        ['', '  empty mass   mean |Δ|   23.5%  ->  '],
        ['g', '0.09%   [17/17 bit-exact]\n'],
        ['', '  centre of P  mean |Δ|   3.32cm ->  '],
        ['g', '0.23cm  [17/17 < 1 cm]\n\n'],
        ['c', '  ACADEMIC VALIDATION  '],
        ['d', '(Niskanen 2013, altimeter-measured)\n'],
        ['', '  C6-3 trusted anchor   151.5 m  ->  '],
        ['g', '151.5 m   Δ -0.0%\n'],
        ['', '  Java OpenRocket       151.5 m  ->  '],
        ['a', '161.4 m   Δ +6.5%\n'],
        ['', '  RockSim 8             151.5 m  ->  '],
        ['m', '180.1 m   Δ +18.9%\n\n'],
        ['c', '  RENDER FIDELITY\n'],
        ['', '  2D blueprint IoU                 '],
        ['g', '0.967  [17/17]\n'],
        ['', '  3D figure   IoU                  '],
        ['g', '0.965  [17/17]\n\n'],
        ['g', '  ✓ parity achieved — '],
        ['d', 'opsrocket-core · opsrocket-sim · opsrocket-view\n'],
      ];
      const el = document.getElementById('log');
      let li = 0, ci = 0;
      function step() {
        if (li >= L.length) {
          document.getElementById('reveal').style.opacity = 1;
          document.getElementById('cta').style.opacity = 1;
          el.classList.remove('cur');
          return;
        }
        el.classList.add('cur');
        const [cls, txt] = L[li];
        if (ci === 0 && cls) {
          el.insertAdjacentHTML('beforeend', '<span class="' + cls + '"></span>');
        }
        const span = cls ? el.lastElementChild : el;
        const isFast = cls === 'd' || txt.length > 26;
        const chunk = isFast ? 3 : 1;
        const next = txt.slice(ci, ci + chunk);
        if (cls) span.textContent += next;
        else el.appendChild(document.createTextNode(next));
        ci += chunk;
        if (ci >= txt.length) { li++; ci = 0; }
        setTimeout(step, isFast ? 8 : 26);
      }
      step();
    </script>
  </body>
</html>
